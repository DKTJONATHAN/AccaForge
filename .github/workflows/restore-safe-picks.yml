name: AccaForge Restore Safe Picks Visibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accaforge-product-generation
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore mislabelled Safe Picks and apply safe schema migration
        env:
          MIGRATE_ONLY: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/generate-daily.mjs

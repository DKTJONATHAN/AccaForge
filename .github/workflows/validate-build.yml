name: AccaForge Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check daily generator JavaScript syntax
        run: node --check scripts/generate-daily.mjs && node --check scripts/enrich-football-data.mjs && node --check scripts/refresh-results.mjs
      - name: Validate SEO verification scripts
        run: node --check scripts/verify-seo.mjs && bash -n scripts/verify-seo.sh
      - name: Type-check and build
        run: npm run build

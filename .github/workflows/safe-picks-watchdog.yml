name: AccaForge Safe Picks Watchdog

on:
  schedule:
    - cron: "30 6 * * *" # 09:30 AM Africa/Nairobi; Safe Picks is scheduled for 09:00
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: accaforge-safe-picks-watchdog
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check today's Safe Picks run and dispatch if it never started
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com"
          WORKFLOW="generate-safe-picks.yml"
          # Nairobi midnight is 21:00 UTC on the previous calendar day.
          NBI_MIDNIGHT_EPOCH="$(TZ=Africa/Nairobi date -d 'today 00:00' +%s)"
          SINCE="$(date -u -d "@${NBI_MIDNIGHT_EPOCH}" +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Checking Safe Picks runs created since ${SINCE}."

          get_runs() {
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/repos/${REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=100&created=>=${SINCE}"
          }

          RUNS="$(get_runs)"
          COUNT="$(jq --arg since "${SINCE}" '[.workflow_runs[] | select(.created_at >= $since)] | length' <<< "${RUNS}")"

          if [ "${COUNT}" -gt 0 ]; then
            echo "Safe Picks has already started today (${COUNT} run(s)); no recovery dispatch needed."
            jq -r '.workflow_runs[] | [.id, .status, (.conclusion // "running"), .created_at, .html_url] | @tsv' <<< "${RUNS}"
            exit 0
          fi

          echo "::warning::No Safe Picks run has started today. Dispatching the scheduled workflow manually."
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
            -d '{"ref":"main"}'

          echo "Manual recovery dispatch accepted. Waiting for GitHub Actions to register the run..."
          for attempt in $(seq 1 12); do
            sleep 10
            RUNS="$(get_runs)"
            COUNT="$(jq --arg since "${SINCE}" '[.workflow_runs[] | select(.created_at >= $since)] | length' <<< "${RUNS}")"
            if [ "${COUNT}" -gt 0 ]; then
              echo "Recovery run registered:"
              jq -r '.workflow_runs[] | [.id, .status, (.conclusion // "running"), .created_at, .html_url] | @tsv' <<< "${RUNS}"
              exit 0
            fi
          done

          echo "::error::Recovery dispatch was accepted, but no Safe Picks run appeared within 2 minutes."
          exit 1

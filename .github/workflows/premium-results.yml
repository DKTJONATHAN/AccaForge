name: AccaForge Premium Results

on:
  schedule:
    - cron: "0 7 * * *" # 10:00 Africa/Nairobi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accaforge-premium-results
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate settlement and OddsPapi syntax
        run: node --check scripts/lib/oddspapi.mjs && node --check scripts/settle-premium.mjs
      - name: Settle completed Premium fixtures
        run: node scripts/settle-premium.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREMIUM_FOOTBALL_KEY: ${{ secrets.PREMIUM_FOOTBALL_KEY }}
          PREMIUM_FOOTBALL_KEY1: ${{ secrets.PREMIUM_FOOTBALL_KEY1 }}
          PREMIUM_FOOTBALL_KEY2: ${{ secrets.PREMIUM_FOOTBALL_KEY2 }}

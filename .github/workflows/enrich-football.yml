name: AccaForge Enrich Football Data

on:
  workflow_run:
    workflows: ["AccaForge Generate All Matches"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Discover every club and league represented in published AccaForge competitions, then cache artwork in Cloudflare"
        required: true
        type: choice
        options:
          - "yes"
        default: "yes"

permissions:
  contents: read

concurrency:
  group: accaforge-enrich-football
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Discover full league rosters, club crests and competition artwork
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait 10 minutes after all generation workflows finish
        run: sleep 600

      - name: Check out AccaForge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover every published league and all club artwork
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: node scripts/enrich-football-data.mjs

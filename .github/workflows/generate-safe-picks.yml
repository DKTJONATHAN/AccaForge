name: AccaForge Generate Safe Picks

on:
  schedule:
    - cron: "0 6 * * *" # 09:00 AM Africa/Nairobi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accaforge-product-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backup refresh of yesterday's results
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          ODDSAPI_KEY1: ${{ secrets.ODDSAPI_KEY1 }}
          ODDSAPI_KEY2: ${{ secrets.ODDSAPI_KEY2 }}
          ODDSAPI_KEY3: ${{ secrets.ODDSAPI_KEY3 }}
        run: node scripts/refresh-results.mjs

      - name: Generate Safe Picks
        env:
          PRODUCT_TYPES: safe_picks
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          ODDSAPI_KEY1: ${{ secrets.ODDSAPI_KEY1 }}
          ODDSAPI_KEY2: ${{ secrets.ODDSAPI_KEY2 }}
          ODDSAPI_KEY3: ${{ secrets.ODDSAPI_KEY3 }}
# IMPORTANT: Groq API credentials are stored in legacy-named GitHub Secrets GEMINI_API_KEY, GEMINI_API_KEY1, GEMINI_API_KEY2.
          # These secrets contain Groq keys and MUST map to GROQ_API_KEY, GROQ_API_KEY1, GROQ_API_KEY2 below.
          # Do not rename either side unless the GitHub Secrets and scripts are deliberately migrated together.
          GROQ_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          GROQ_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GROQ_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_FALLBACK_MARKETS: ${{ vars.ODDS_FALLBACK_MARKETS }}
          ODDS_SPORT_KEYS: ${{ vars.ODDS_SPORT_KEYS }}
        run: node scripts/generate-daily.mjs

name: AccaForge Scheduled Jobs

on:
  schedule:
    - cron: "10 0 * * *" # 3:10 AM Africa/Nairobi - results refresh
    - cron: "10 6 * * *" # 9:10 AM Africa/Nairobi - daily generation
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        type: choice
        options:
          - generate
          - results
          - enrich
        default: generate

permissions:
  contents: read

concurrency:
  group: accaforge-scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh yesterday's results directly from GitHub (3 AM EAT)
        if: (github.event_name == 'schedule' && github.event.schedule == '10 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'results')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          ODDSAPI_KEY1: ${{ secrets.ODDSAPI_KEY1 }}
          ODDSAPI_KEY2: ${{ secrets.ODDSAPI_KEY2 }}
          ODDSAPI_KEY3: ${{ secrets.ODDSAPI_KEY3 }}
        run: node scripts/refresh-results.mjs

      - name: Generate and publish daily accumulators directly from GitHub (9 AM EAT)
        if: (github.event_name == 'schedule' && github.event.schedule == '10 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'generate')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
          ODDSAPI_KEY1: ${{ secrets.ODDSAPI_KEY1 }}
          ODDSAPI_KEY2: ${{ secrets.ODDSAPI_KEY2 }}
          ODDSAPI_KEY3: ${{ secrets.ODDSAPI_KEY3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY1: ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_FALLBACK_MARKETS: ${{ vars.ODDS_FALLBACK_MARKETS }}
          ODDS_SPORT_KEYS: ${{ vars.ODDS_SPORT_KEYS }}
        run: node scripts/generate-daily.mjs

      - name: Discover team and competition artwork for today and yesterday (GitHub → D1)
        if: (github.event_name == 'schedule' && (github.event.schedule == '10 0 * * *' || github.event.schedule == '10 6 * * *')) || (github.event_name == 'workflow_dispatch' && (inputs.task == 'generate' || inputs.task == 'results' || inputs.task == 'enrich'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/enrich-football-data.mjs

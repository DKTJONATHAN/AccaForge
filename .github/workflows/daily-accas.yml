name: AccaForge Daily Accumulators

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "Africa/Nairobi"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accaforge-daily-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish daily football accumulators
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare token and D1 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = (process.env.CLOUDFLARE_API_TOKEN || "").trim();
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is empty.");
          console.log(JSON.stringify({ tokenLength: token.length }));
          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          };
          const checks = [
            ["Token verification", `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/tokens/verify`],
            ["D1 database access", `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}`]
          ];
          for (const [label, url] of checks) {
            const response = await fetch(url, { headers });
            const body = await response.json();
            console.log(`${label}: HTTP ${response.status}`);
            console.log(JSON.stringify({ success: body.success, result: body.result, errors: body.errors }));
            if (!response.ok || !body.success) process.exitCode = 1;
          }
          NODE
      - name: Generate, validate and store today's accumulators
        env:
          ODDS_API_KEY: ${{ secrets.ODDSAPI_KEY || secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_EXTRA_MARKETS: ${{ vars.ODDS_EXTRA_MARKETS }}
          ODDS_EXTRA_EVENT_LIMIT: ${{ vars.ODDS_EXTRA_EVENT_LIMIT }}
          ODDS_MAX_SPORTS: ${{ vars.ODDS_MAX_SPORTS }}
          ODDS_SPORT_KEYS: ${{ vars.ODDS_SPORT_KEYS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/generate-daily.mjs

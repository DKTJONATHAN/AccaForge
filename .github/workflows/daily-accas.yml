name: AccaForge Scheduled Jobs

on:
  schedule:
    - cron: "0 0 * * *" # 3:00 AM Africa/Nairobi - results refresh
    - cron: "0 6 * * *" # 9:00 AM Africa/Nairobi - daily generation
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        type: choice
        options:
          - generate
          - results
          - enrich
        default: generate

permissions:
  contents: read

concurrency:
  group: accaforge-scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh yesterday's results (3 AM EAT)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'results')
        env:
          ACCAFORGE_SCHEDULER_TOKEN: ${{ secrets.ACCAFORGE_SCHEDULER_TOKEN }}
          ACCAFORGE_WORKER_URL: ${{ vars.ACCAFORGE_WORKER_URL }}
        run: |
          node --input-type=module <<'NODE'
          const base=(process.env.ACCAFORGE_WORKER_URL||"https://accaforge.eu.cc").replace(/\/$/,"");
          if(!process.env.ACCAFORGE_SCHEDULER_TOKEN) throw new Error("Missing ACCAFORGE_SCHEDULER_TOKEN repository secret.");
          const response=await fetch(base+"/__scheduler/results",{method:"POST",headers:{Authorization:"Bearer "+process.env.ACCAFORGE_SCHEDULER_TOKEN}});
          const body=await response.text();
          console.log(body);
          if(!response.ok) throw new Error("Results refresh failed: HTTP "+response.status);
          NODE
      - name: Generate and publish daily accumulators (9 AM EAT)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'generate')
        env:
          ACCAFORGE_SCHEDULER_TOKEN: ${{ secrets.ACCAFORGE_SCHEDULER_TOKEN }}
          ACCAFORGE_WORKER_URL: ${{ vars.ACCAFORGE_WORKER_URL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_FALLBACK_MARKETS: ${{ vars.ODDS_FALLBACK_MARKETS }}
          ODDS_SPORT_KEYS: ${{ vars.ODDS_SPORT_KEYS }}
        run: node scripts/generate-daily.mjs

      - name: Enrich published matches with club crests and league tables
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'generate' || inputs.task == 'enrich'))
        env:
          ACCAFORGE_SCHEDULER_TOKEN: ${{ secrets.ACCAFORGE_SCHEDULER_TOKEN }}
          ACCAFORGE_WORKER_URL: ${{ vars.ACCAFORGE_WORKER_URL }}
        run: node scripts/enrich-football-data.mjs

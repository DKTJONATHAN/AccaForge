name: AccaForge Distillation Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/groq-five-key-distillation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: npm test
      - name: Check generator syntax
        run: |
          node --check scripts/generate-daily.mjs
          node --check scripts/lib/api-keys.mjs
          node --check scripts/lib/distillation.mjs
